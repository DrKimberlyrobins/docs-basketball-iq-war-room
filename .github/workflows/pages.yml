name: Refresh and publish Basketball IQ War Room
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'site/data/board.json'
      - 'site/data/history.json'
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: basketball-iq-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: inputs/raw
          key: basketball-iq-boxes-${{ github.run_id }}
          restore-keys: basketball-iq-boxes-
      - run: python refresh.py
      - name: Commit forecasts and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/board.json site/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Basketball IQ research'
            git push origin main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
